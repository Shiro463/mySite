#question{
  position:absolute;
  top:9%;
  height:20%;
  left:20%;
  transform:translateX(-50%);
  width:40%;
  padding:8px;
  overflow-y:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  vertical-align: top;
  text-align:left;
  line-height:1.15;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-size:24px;
}
.noWrap{
  white-space:nowrap;
}

/* 漢字パーツ1・四字熟語1：改行を保持し、行内で折り返さない */
#question.preserveLines,
#answer.preserveLines{
  white-space:pre;
  overflow-wrap:normal;
  word-break:normal;
}

#answer{
  position:absolute;
  top:28%;
  height:12%;
  left:50%;
  transform:translateX(-50%);
  width:min(92vw,980px);
  padding:6px;
  text-align:left;
  vertical-align: top;
  line-height:1.25;
  overflow-y:auto;
  overflow-x:auto;
  display:none;
  z-index:4;
  align-items:center;
  justify-content:center;
  word-break:break-word;
  font-size:24px;
}

#exp{
  position:absolute;
  display:none;
  top:34%;
  height:20%;
  left:50%;
  transform:translateX(-50%);

  z-index:5;
  align-items:center;
  justify-content:center;
  word-break:break-word;
  font-size:24px;

#questionInfo{

#filterArea{

#controlArea{

button,select{

.flash{animation:flash .35s}
@keyframes flash{
0%,100%{filter:none}
50%{filter:brightness(1.45)}
}
.boom{animation:boom .55s forwards}
@keyframes boom{
0%{transform:translateX(-50%) scale(1)}
100%{transform:translateX(-50%) scale(2.5);opacity:0}
}
.laser{
position:absolute;
left:50%;
bottom:80px;
transform:translateX(-50%);
width:8px;
height:0;
background:#fff;
box-shadow:0 0 18px #fff,0 0 28px #38bdf8;
animation:laser .35s forwards;
z-index:20;
}
@keyframes laser{
from{height:0}
to{height:72%}
}

#centerTimer{

     2px  2px 0 #dc2626,

inset:0;
display:none;

#statsPanel{

  background:#fff;
  color:#111;
  border-radius:18px;

/* 上部固定ヘッダー */
#statsHeader{
  position:sticky;
  top:0;
  z-index:50;
  background:#ffffffee;
  backdrop-filter:blur(8px);
  padding:12px;

#statsBody{

  margin:0 auto 18px auto;

  background:#fff;
}

  display:block;
  margin:0 auto 20px auto;

}

padding:7px 0;
border-bottom:1px solid #ddd;
font-size:14px;

  width:95%;

.panelRow{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:6px;
  width:100%;
  margin:4px auto;
  transform:translateX(-50%);
  font-size:10px;
}

.datasetBtn{
  border:1px solid #d9c19a;
  background:#334155;
  color:white;
  font-size:10px;
  font-weight:900;
}
.filterBtn{
  border:1px solid #000000;
  background:#f5e6c8;
  color:#3b2f20;
  border:1px solid #d8d4ce;
  font-size:10px;
  font-weight:900;
}
.controlBtn{
  border:1px solid #e4ddd3;
  font-size:10px;
  font-weight:900;
}

.filterBtn.activeBtn{
  background:#e3f424;
  color:black;
  font-size:10px;
  font-weight:900;
}

.activeBtn{
  background:#2563eb;
  font-size:10px;
  font-weight:900;
}

/* 条件入力 */

.smallInput{
  width:30px;
  border-radius:10px;
  border:none;
  padding:6px;
  text-align:center;
  font-size:6px;
  font-size:10px;
  font-weight:900;
}



/* 選択肢 */
#choices{
  position:absolute;
  top:24%;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
  z-index:25;
}

/* 四字熟語の選択肢は3列×3行 */
#choices.yojiChoices{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.choiceBtn{
  min-height:26px;
  border:none;
  border-radius:14px;
  background:
  linear-gradient(
  #ffebfd,
  #98f3ff);
  color:black;
  font-size:10px;
  font-weight:90px;
  padding:2px;
  box-shadow:
  0 2px 10px rgba(0,0,0,.35);
}

.choiceBtn:active{
  transform:scale(.96);
}
/* 選択肢の判定マークをボタンの内側に重ねる */
.choiceBtn {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}

/* 正解を示す青い円 */
.choiceBtn.markCorrect::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);

  width: clamp(20px, 5vw, 42px);
  aspect-ratio: 1;
  box-sizing: border-box;
  border-radius: 50%;

  border: 4px solid rgba(19, 27, 138, 0.95);

  pointer-events: none;
  z-index: 2;
}

/* 不正解を示す赤い× */
.choiceBtn.markWrong::after {
  content: "×";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -52%);

  font-family: Arial, sans-serif;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 900;
  line-height: 1;

  color: rgba(255, 0, 0, 0.72);
  -webkit-text-stroke: 3px rgba(255, 255, 255, 0.95);
  paint-order: stroke fill;

  pointer-events: none;
  z-index: 3;
}

/* 文字サイズの調整が終わるまでテキストを隠す */
#question,
#answer,
#exp {
  visibility: hidden;
}

/* 調整完了後に表示 */
#question.textReady,
#answer.textReady,
#exp.textReady {
  visibility: visible;
}

  try{
    return JSON.parse(
      localStorage.getItem(keyName(dataset,q)) ||
      JSON.stringify({
        correct:0,
        wrong:0,

        stability:0,
        difficulty:5,
        // retrievability:1,
        lastReview:"",

        reps:0,
        lapses:0,

        due:"",

        last:"",
        lastDate:"",

        fav:false,
        skipUntil:0,
        skipCount:0
      })
    );
  }catch(e){
    return{
      correct:0,
      wrong:0,

      stability:0,
      difficulty:5,
      // retrievability:1,

      lastReview:"",

      reps:0,
      lapses:0,

      last:"",
      lastDate:"",

      skipUntil:0,
      skipCount:0
    }
  }
}

function fsrsReview(stat, rating){

  const now = new Date();

  const last =
    stat.lastReview
      ? new Date(stat.lastReview)
      : now;

  const elapsed =
    Math.max(
      1,
      (now-last)/(1000*60*60*24)
    );

  let s =
    stat.stability || 0;

  let d =
    stat.difficulty || 5;

  if(stat.reps===0){

    switch(rating){

      case 1: // Again
        s=0.5;
        d=8;
        break;

      case 2: // Hard
        s=1;
        d=7;
        break;

      case 3: // Good
        s=3;
        d=5;
        break;

      case 4: // Easy
        s=7;
        d=3;
        break;
    }

  }else{

    if(rating===1){

      stat.lapses++;

      s=
        Math.max(
          0.5,
          s*0.4
        );

      d=
        Math.min(
          10,
          d+1
        );

    }else{

      let factor=1;

      if(rating===2)
        factor=1.2;

      if(rating===3)
        factor=2.0;

      if(rating===4)
        factor=3.0;

      s=
        s*
        (
          1+
          factor*
          (
            11-d
          )/10
        );

      d=
        Math.max(
          1,
          d-
          (
            rating-2
          )*0.3
        );
    }
  }

  let interval =
    Math.round(s);

  stat.stability=s;
  stat.difficulty=d;
  stat.reps++;

  stat.lastReview=
    now.toISOString();

  const due=
    new Date(now);

  due.setDate(
    due.getDate()
    + interval
  );

  stat.due=
    due.toISOString();

  return stat;
};

function calcRetrievability(stat){

  if(!stat.lastReview)
    return 0;

  const elapsed =
    (
      Date.now()
      -
      new Date(
        stat.lastReview
      )
    )/86400000;

  const S =
    Math.max(
      0.1,
      stat.stability
    );

  return Math.pow(
    1 + elapsed/(9*S),
    -1
  );
};

function shuffle(a){
    for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
}

function todayStr(){
    const d=new Date();
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,"0");
    const da=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${da}`;
}

function diffDays(dateStr){
    if(!dateStr)return 9999;
    const t1=new Date(dateStr);
    const t2=new Date(todayStr());
    return Math.floor((t2-t1)/(1000*60*60*24));
}

function nl2br(str){
  if(!str) return "";
  return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replace(/\\n/g,"\n")
    .replace(/\n/g,"<br>");
}


function escapeHtml(str){
    return str
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function escapeHtmlWithBr(str){
  return escapeHtml(String(str))
    .replace(/\r?\n/g, "<br>");
}



/* load */
async function loadSheet(){

    const ds=DATASETS[currentDataset||0];
    LIMIT_TIME = ds.time || 5;

    const url=
    "https://docs.google.com/spreadsheets/d/"
    +ds.id+
    "/gviz/tq?sheet="+encodeURIComponent(ds.sheet);

    const txt=await (await fetch(url)).text();

    const m=txt.match(/setResponse\((.*)\);/s);
    const json=JSON.parse(m[1]);

    data=(json.table.rows||[]).map(r=>{

      const c=r.c||[];

      /* A列 = 固定ID */
      const id=
        c[0]&&c[0].v!=null
        ? String(c[0].v).trim()
        : "";

      let q="";
      let a="";
      let e="";

      if(ds.questionCreateMode==="kanji_parts1"){

        /* F列問題 (E→Fへ1列ずれる) */
        q=c[5]?.v!=null
          ? String(c[5].v).replace(/\\\\n/g,"\n").trim()
          : "";

        /* E列答え */
        a=c[4]?.v!=null
          ? String(c[4].v)
              .replace(/\\n/g,"\n")
              .trim()
          : "";

        e="";

      }else{

        let qRaw="";

        if(ds.questionCreateMode==="fullAnswer"){

          /* C列 */
          qRaw=c[2]?.v!=null
            ? String(c[2].v).trim()
            : "";

        }else{

          /* B列 */
          qRaw=c[1]?.v!=null
            ? String(c[1].v).trim()
            : "";
        }

        /* D列 */
        const raw=
          c[3]?.v!=null
          ? String(c[3].v)
          : "";

        const normalized=
          raw.replace(/\\n/g,"\n");

        if(ds.questionCreateMode==="fullAnswer"){

          q=qRaw;
          a=normalized.trim();
          e="";

        }else{

          const lines=
            normalized.split("\n");

          q=qRaw;

          a=(lines.shift()||"")
            .trim();

          e=lines
            .join("\n")
            .trim();
        }
      }

      // let yomi = "";

      // const match = a.match(/（([^）]+)）/);
      // if(match){
      //   yomi = match[1];
      // }

      const firstYomi =
        c[8]?.v != null
          ? String(c[8].v).trim()
          : "";

      const secondYomi =
        c[9]?.v != null
          ? String(c[9].v).trim()
          : "";

      return{
        id,
        q,
        a,
        e,
        firstYomi,
        secondYomi
      };

    }).filter(x=>x.id&&x.q&&x.a);
}

// 四字熟語用　選択肢生成
function createYojiChoices(cur){

  const frontBlank =
    cur.q.trim().startsWith("____");

  const correct =
    frontBlank
      ? cur.firstYomi
      : cur.secondYomi;

  const pool = [];

  data.forEach(row=>{

    const candidate =
      frontBlank
        ? row.firstYomi
        : row.secondYomi;

    if(candidate){
      pool.push(candidate);
    }
  });

  const uniquePool =
    [...new Set(pool)]
      .filter(x=>x!==correct);

  shuffle(uniquePool);

  // 正解1つ＋不正解8つで、選択肢を合計9つにする
  return shuffle([
    correct,
    ...uniquePool.slice(0,8)
  ]);
}

function renderChoices(cur){

  const area=
    $("choices");

  area.innerHTML="";

  const ds=
    DATASETS[currentDataset];

  // 四字熟語のときだけ3列表示用クラスを付ける
  area.classList.toggle(
    "yojiChoices",
    ds.name.startsWith("四字熟語")
  );

  if(
    !ds.name.startsWith("四字熟語")
  ){
    return;
  }

  const frontBlank =
    cur.q.startsWith("____");

  const correct =
    frontBlank
    ? cur.firstYomi
    : cur.secondYomi;

  const choices =
    createYojiChoices(cur);

  choices.forEach(text=>{

      const btn=
        document.createElement("button");

      btn.className=
        "choiceBtn";

      btn.textContent=
        text;

      btn.onclick = () => {

        // すでに判定済みなら何もしない
        if (pendingYojiResult !== null) return;

        pendingYojiResult = (text === correct);

        // すべての選択肢から、以前の判定マークを消す
        document.querySelectorAll(".choiceBtn").forEach(button => {
          button.classList.remove("markCorrect", "markWrong");
        });

        // 正解の選択肢を探す
        const correctButton = [...area.querySelectorAll(".choiceBtn")]
          .find(button => button.textContent === correct);

        if (pendingYojiResult) {

          // 正解：押した選択肢に青い円
          btn.classList.add("markCorrect");

        } else {

          // 不正解：正解の選択肢に青い円
          if (correctButton) {
            correctButton.classList.add("markCorrect");
          }

          // 押した選択肢に赤い×
          btn.classList.add("markWrong");
        }

        // 既存の答え表示・選択肢の無効化を実行
        showAnswer();
      };
      area.appendChild(btn);
  });

}


/* queue */
function buildQueue(){

  const ds =
    DATASETS[currentDataset];

  const stabilityLimit =
    Number(
      $("stabilityLimit").value || 0
    );

  const oldDays =
    Number(
      $("oldDays").value || 0
    );

  const now = new Date();

  let target = data.filter(q=>{

    const s =
      getStat(
        ds.name,
        q.id
      );

    /* スルー期間中 */
    if(
      s.skipUntil &&
      s.skipUntil >= todayStr()
    ){
      return false;
    };

    /* 安定性フィルタ */
    if(
      (s.stability || 0) < stabilityLimit
    ){
      return false;
    };

    /* 日数フィルタ */
    if(
      oldDays > 0 && diffDays(s.lastDate) < oldDays
    ){
      return false;
    };

    /* FSRS期限 */
    // const due =
    //   s.due
    //   ? new Date(s.due)
    //   : null;

    // if(
    //   due &&
    //   due > now
    // ){
    //   return false;
    // };

    const desiredRetention =
      0.9;

    switch(currentFilter){

      case "correct":
        return s.last==="correct";

      case "wrong":
        return s.last==="wrong";

      case "unseen":
        return (
          s.correct===0 &&
          s.wrong===0
        );

      case "fav":
        return s.fav===true;
    }

    return true;

  });

  shuffle(target);

  queue = target;

  $("left").textContent =
    queue.length;
};

      const btn=$(id);

      if(!btn) return;

      btn.disabled=!enabled;

      btn.style.opacity=
        enabled
        ? "1"
        : "0.45";

    });

/* hit */
function hit(ok){

    if(!cur||gameOver)return;

    const ds=DATASETS[currentDataset||0];
    let s=getStat(ds.name,cur.id);

    if(ok){

        laser();

        score++;

        /* 初回正解か？ */
        // const firstClear =
        //   s.correct === 0 &&
        //   s.wrong === 0;

        s.correct++;

        s = fsrsReview(
          s,
          remain > LIMIT_TIME*0.7
            ? 4     // Easy
            : 3     // Good
        );

        s.last="correct";

        $("status").textContent="正解！";

        addDailyCorrect();

      }else{

        hp--;                    /* ←これが抜けていた */
        $("hp").textContent=hp;

        s.wrong++;

        s = fsrsReview(
          s,
          1         // Again
        );


        s.last="wrong";

        $("status").textContent="被弾!";

        addDailyWrong();

        if(hp<=0){

            gameOver=true;

            $("hp").textContent=0;
            $("question").textContent="GAME OVER";
            $("answer").textContent="";
            $("exp").textContent="";
            $("status").textContent="STARTで再挑戦";

            resizeAllTexts();
            
            setStat(ds.name,cur.id,s);
            
            updateWR();
            setJudgeButtonsEnabled(false);

            return;
        }
    }

    s.lastDate=todayStr();

    setStat(ds.name,cur.id,s);

    $("score").textContent=score;
    $("hp").textContent=hp;

    s.skipUntil="";
    s.skipCount=0;

    setTimeout(nextQuestion,550);

    setJudgeButtonsEnabled(true);

    // /* 正解時 */
    // addDailyCorrect();

    // /* 不正解時 */
    // addDailyWrong();
}


function skipQuestion(){

  if(!cur || gameOver) return;

  const ds = DATASETS[currentDataset||0];

  let s = getStat(ds.name, cur.id);

  s.skipCount = (s.skipCount || 0) + 1;

  let days;

  switch(s.skipCount){

    case 1:
      days = 3;
      break;

    case 2:
      days = 7;
      break;

    default:
      days = 14;
      break;
  }

  const d = new Date();
  d.setDate(d.getDate() + days);


  s.skipUntil =
    d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");

  s.last = "skip";
  s.lastDate = todayStr();

  setStat(ds.name, cur.id, s);

  $("status").textContent = "スルー";

  setJudgeButtonsEnabled(true);

  setTimeout(nextQuestion,350);
};



function updateRetrStats(){

  const ds=DATASETS[currentDataset];

  const rBins=[0,0,0,0,0];
  const sBins=[0,0,0,0];

  data.forEach(q=>{

    const s=getStat(ds.name,q.id);

    const r=calcRetrievability(s);

    if(r<0.2) rBins[0]++;
    else if(r<0.4) rBins[1]++;
    else if(r<0.6) rBins[2]++;
    else if(r<0.8) rBins[3]++;
    else rBins[4]++;

    const st=s.stability||0;

    if(st===0)
      sBins[0]++;
    else if(st<5)
      sBins[1]++;
    else if(st<10)
      sBins[2]++;
    else
      sBins[3]++;

  });

  $("retrHUD").innerHTML=`
  <b>想起率</b><br>
  0-20%:${rBins[0]}<br>
  20-40%:${rBins[1]}<br>
  40-60%:${rBins[2]}<br>
  60-80%:${rBins[3]}<br>
  80-100%:${rBins[4]}<br>
  <br>
  <b>安定性</b><br>
  0日:${sBins[0]}<br>
  0.1-5日:${sBins[1]}<br>
  5-10日:${sBins[2]}<br>
  10日以上:${sBins[3]}
  `;
}

/* 統計 */
function drawStats(){

    $("statsWrap").style.display="block";

    const ds=DATASETS[currentDataset||0];


    const cvs=$("chart");
    const ctx=cvs.getContext("2d");
    ctx.clearRect(0,0,cvs.width,cvs.height);

    const bins=[
      0, // 未学習
      0, // 0-20
      0, // 20-40
      0, // 40-60
      0, // 60-80
      0  // 80-100
    ];

    // const cols=["#22c55e","#ef4444","#3b82f6"];
    
    data.forEach(x=>{

      const s=
        getStat(ds.name,x.id);

      if(!s.lastReview){

        bins[0]++;

      }else{

        const r=calcRetrievability(s);

        if(r<0.2) bins[1]++;
        else if(r<0.4) bins[2]++;
        else if(r<0.6) bins[3]++;
        else if(r<0.8) bins[4]++;
        else bins[5]++;

      }

    });

    const cols=[
      "#9ca3af", //未学習
      "#dc2626",
      "#f97316",
      "#eab308",
      "#22c55e",
      "#2563eb"
    ];

    const labels=[
      "未学習",
      "0-20%",
      "20-40%",
      "40-60%",
      "60-80%",
      "80-100%"
    ];

    labels.forEach((txt,i)=>{
      ctx.fillStyle=cols[i];
      ctx.fillRect(
        240,
        60+i*30,
        18,
        18
      );
      ctx.fillStyle="#111";
      ctx.fillText(
        txt+" "+bins[i]+"問",
        270,
        74+i*30
      );
    });

    const total =
      Math.max(
        bins.reduce((a,b)=>a+b,0),
        1
      );

    let start=-Math.PI/2;

    bins.forEach((v,i)=>{

      const ang=
        v/total*Math.PI*2;

      ctx.beginPath();

      ctx.moveTo(120,120);

      ctx.fillStyle=
        cols[i];

      ctx.arc(
        120,
        120,
        90,
        start,
        start+ang
      );

      ctx.fill();

      start+=ang;

    });


    ctx.fillStyle="#111";
    ctx.font="16px sans-serif";

    const mode=$("sortMode").value;

    const rows=[...data];

    rows.sort((a,b)=>{

    const sa = getStat(ds.name,a.id);
    const sb = getStat(ds.name,b.id);

    switch(mode){

        case "correct_desc":
        return sb.correct - sa.correct;

        case "correct_asc":
        return sa.correct - sb.correct;

        case "wrong_desc":
        return sb.wrong - sa.wrong;

        case "wrong_asc":
        return sa.wrong - sb.wrong;

        case "stability_desc":
        return sb.stability - sa.stability;

        case "stability_asc":
        return sa.stability - sb.stability;

        case "retr_desc":
          return calcRetrievability(sb)
              - calcRetrievability(sa);

        case "retr_asc":
          return calcRetrievability(sa)
              - calcRetrievability(sb);

        case "difficulty_desc":
          return sb.difficulty - sa.difficulty;

        case "difficulty_asc":
          return sa.difficulty - sb.difficulty;


        /* ▼ 修正版：日付文字列比較ではなく Date比較 */
        case "date_desc":
        return new Date(sb.lastDate || "1900-01-01")
            - new Date(sa.lastDate || "1900-01-01");

        case "date_asc":
        return new Date(sa.lastDate || "1900-01-01")
            - new Date(sb.lastDate || "1900-01-01");
    }

    return 0;
    });



    $("list").innerHTML = rows.map(x=>{

    const s=getStat(ds.name,x.id);

    const dueText =
      s.due
      ? s.due.slice(0,10)
      : "-";

    let skipText = "なし";

    if(s.skipUntil){

        const today = todayStr();

        if(s.skipUntil >= today){

            const limit =
            new Date(s.skipUntil);

            const now =
            new Date();

            const remainDays =
            Math.ceil(
                (limit-now)
                /86400000
            );

            skipText =
            `🕒 あと${remainDays}日`;

        }else{

            skipText =
            "期限切れ";

        }

    }

    return `
    <div class="row">

      <b>${escapeHtmlWithBr(x.q)}</b><br>

      安定性:${s.stability?.toFixed(1) || 0}日
      難易度:${s.difficulty?.toFixed(1) || 0}
      想起率:${(calcRetrievability(s)*100).toFixed(0)}%
      次回:${dueText}
      最終:${s.lastDate||"-"}
      スルー回数:${s.skipCount || 0}
      スルー:${skipText}



      <br><br>

      <button
        onclick="toggleFav('${x.id}')"
        class="misc">

        ${s.fav ? "★解除" : "☆お気に入り"}

      </button>

    </div>
    `;
    }).join("");


    drawDailyChart();
    drawStabilityChart();
    drawDailyStabilityChart();

};

function drawDailyStabilityChart(){

  const cvs=
    $("stabilityDailyChart");

  const ctx=
    cvs.getContext("2d");

  ctx.clearRect(
    0,0,
    cvs.width,
    cvs.height
  );

  const ds=
    getCurrentDataset();

  const prefix=
    `daily_stability_${ds.id}_`;

  const keys=
    Object.keys(localStorage)
      .filter(k=>
        k.startsWith(prefix)
      )
      .sort();

  const rows=
    keys.map(k=>({

      date:
        k.replace(prefix,""),

      value:
        Number(
          localStorage.getItem(k)
        )

    }));

  if(rows.length===0)
    return;

  if(rows.length===1){
    ctx.beginPath();
    ctx.arc(
      120,
      120,
      6,
      0,
      Math.PI*2
    );

    ctx.fillStyle="#2563eb";
    ctx.fill();

    return;
  }

  const max=
    Math.max(
      ...rows.map(x=>x.value),
      1
    );

  const W=760;
  const H=220;

  const sx=60;
  const sy=260;

  ctx.beginPath();

  rows.forEach((r,i)=>{

    const x=
      sx+
      i*
      (
        W/
        Math.max(
          rows.length-1,
          1
        )
      );

    const y=
      sy-
      (r.value/max)*H;

    if(i===0)
      ctx.moveTo(x,y);
    else
      ctx.lineTo(x,y);

  });

  ctx.strokeStyle="#2563eb";
  ctx.lineWidth=3;
  ctx.stroke();

};

function drawDailyChart(){

  const cvs = $("dailyChart");
  const ctx = cvs.getContext("2d");

  ctx.clearRect(0,0,cvs.width,cvs.height);

  const ds = getCurrentDataset();
  const prefix = `daily_visit_${ds.id}_`;

  const keys = Object.keys(localStorage)
    .filter(k => k.startsWith(prefix))
    .sort();

  const rawRows = keys.map(k => ({
    date: k.replace(prefix, ""),
    ...JSON.parse(localStorage.getItem(k))
  }));

  /* 累計化 */
  let totalCorrect = 0;
  let totalWrong = 0;

  const rows = rawRows.map(r => {

    totalCorrect += r.correct;
    totalWrong += r.wrong;

    return {
      date: r.date,
      correct: totalCorrect,
      wrong: totalWrong
    };
  });

  if(rows.length === 0) return;

  const max = Math.max(
    ...rows.map(x => Math.max(x.correct, x.wrong)),
    1
  );

  const W = 760;
  const H = 220;
  const sx = 60;
  const sy = 260;
  const gridCount = 5;

  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.moveTo(sx,20);
  ctx.lineTo(sx,sy);
  ctx.lineTo(sx+W,sy);
  ctx.stroke();

  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 1;

  for(let i=0;i<=gridCount;i++){
    const y = sy - (H/gridCount)*i;

    ctx.beginPath();
    ctx.moveTo(sx,y);
    ctx.lineTo(sx+W,y);
    ctx.stroke();

    const val = Math.round(max/gridCount*i);
    ctx.fillStyle = "#333";
    ctx.font = "12px sans-serif";
    ctx.fillText(val, sx-35, y+4);
  }

  rows.forEach((r,i)=>{
    const x = sx + i*(W/Math.max(rows.length-1,1));

    ctx.beginPath();
    ctx.moveTo(x,20);
    ctx.lineTo(x,sy);
    ctx.stroke();
  });

  function drawLine(type,color){
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;

    rows.forEach((r,i)=>{
      const x = sx + i*(W/Math.max(rows.length-1,1));
      const y = sy - (r[type]/max)*H;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });

    ctx.stroke();

    rows.forEach((r,i)=>{
      const x = sx + i*(W/Math.max(rows.length-1,1));
      const y = sy - (r[type]/max)*H;

      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.arc(x,y,5,0,Math.PI*2);
      ctx.fill();
    });
  }

  drawLine("correct","#22c55e");
  drawLine("wrong","#ef4444");

  ctx.fillStyle = "#111";
  ctx.font = "12px sans-serif";

  rows.forEach((r,i)=>{
    const x = sx + i*(W/Math.max(rows.length-1,1));
    ctx.fillText(r.date.slice(5), x-18, 282);
  });

  ctx.fillText("緑=正解数",620,28);
  ctx.fillText("赤=不正解数",620,48);
}

function fitText(el,maxSize=60,minSize=8){

  if(!el) return;

  el.style.fontSize = maxSize + "px";

  let size = maxSize;

  while(size > minSize){

    const over =
      el.scrollWidth > el.clientWidth ||
      el.scrollHeight > el.clientHeight;

    if(!over) break;

    size--;

    el.style.fontSize = size + "px";
  }
}

  // ブラウザに非表示状態とレイアウトを反映させる
  void question.offsetHeight;

  // 文字サイズを調整
  fitText(question, 72, 2);
  fitText(answer, 56, 4);
  fitText(exp, 32, 6);

  // 調整が終わったら表示
  question.classList.add("textReady");

  exp.classList.add("textReady");
}
